<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- The design system, in three layers (docs/design/README.md):
     tokens      tier-1 primitives + tier-2 semantic tokens, both themes
     base        reset, document defaults, typography application
     components  every component in docs/design/06-components.md -->
<link rel="stylesheet" href="/static/styles/tokens.css">
<link rel="stylesheet" href="/static/styles/base.css">
<link rel="stylesheet" href="/static/styles/components.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="mark">Jarvis</div>
    <div class="top__acts">
      <button class="btn btn--small" id="newco" data-act="open-new">New company</button>
      <button class="btn btn--small" data-act="open-settings">Settings</button>
    </div>
  </header>

  <!-- Regions are declared here and filled by app/main.js, so the document has
       a stable shape before any data arrives and nothing shifts when it does. -->
  <div class="tile-row" id="tiles"></div>

  <div id="healthbar" aria-live="polite"></div>
  <div id="flash" aria-live="polite"></div>
  <div id="notes"></div>

  <section id="asks"></section>

  <h2 class="section-head">Your companies</h2>
  <div class="grid" id="cos"></div>
</div>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>

<script type="module" src="/static/app/main.js"></script>
</body>
</html>
