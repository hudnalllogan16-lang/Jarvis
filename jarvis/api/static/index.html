<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<!-- No third-party requests. Jarvis runs locally; a surface that fetches its own
     chrome from someone else's CDN is offline-fragile and tells a third party
     when the operator opened their dashboard (finding M8-F21). fonts.css is
     vendored (jarvis/api/static/fonts/, OFL-licensed) and served from this
     same origin — linked ahead of tokens.css so the three families are
     registered before anything asks for them. The stacks in styles/tokens.css
     keep their platform-face fallbacks for a family that fails to load, never
     for a network request — see docs/design/03-typography.md.
     Pinned by tests/test_design_system.py. -->
<!-- The stored theme choice, applied before the stylesheets below so the
     first paint is never the wrong theme and then a flash to the right one.
     Classic (not `type="module"`), so it runs synchronously as parsed —
     module scripts defer until the document is otherwise ready, which for
     this one purpose is already too late. A plain cookie, not
     `localStorage`/`sessionStorage` (docs/design/02-color.md, D-028's "no
     browser storage APIs" applies to the Web Storage API family the surface
     otherwise never touches): it is the one mechanism a synchronous script
     can read before its own first paint, which is the actual reason for the
     choice, not a loophole in the rule. Absent (no explicit choice recorded)
     is left alone entirely — tokens.css's own `prefers-color-scheme` block
     is what "honors OS default until set" means, and this script does not
     duplicate it. app/theme.js is the one other place this cookie is read
     or written (the Settings control) — see it for the persistence half. -->
<script>(function(){var m=document.cookie.match(/(?:^|; )jarvis_theme=(dark|light)/);
if(m)document.documentElement.setAttribute('data-theme',m[1]);})();</script>
<!-- The design system, in three layers (docs/design/README.md):
     fonts       vendored @font-face declarations (jarvis/api/static/fonts.css)
     tokens      tier-1 primitives + tier-2 semantic tokens, both themes
     base        reset, document defaults, typography application
     components  every component in docs/design/06-components.md -->
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/styles/tokens.css">
<link rel="stylesheet" href="/static/styles/base.css">
<link rel="stylesheet" href="/static/styles/components.css">
</head>
<body>
<a class="skip-link" href="#ws">Skip to content</a>

<!-- The application shell (docs/design/12-application-shell.md). The frame is
     permanent: rail, top bar, system strip, workspace. Only the workspace
     changes when the operator navigates. -->
<div class="shell">

  <aside class="rail" id="rail">
    <div class="rail__mark">Jarvis</div>
    <!-- Filled by app/shell.js from ONE list, so the reserved slots and the
         shipped ones cannot drift apart. -->
    <nav class="rail__nav" id="nav" aria-label="Workspaces"></nav>
  </aside>

  <!-- Dismisses the rail when it is an overlay. Inert while the rail is
       docked; the class is what makes it clickable. -->
  <div class="rail-scrim" id="railScrim"></div>

  <div class="shell__body">

    <header class="topbar">
      <button class="btn btn--small rail-toggle" data-act="toggle-rail"
        id="railToggle" aria-expanded="false" aria-controls="rail">Menu</button>
      <h1 class="topbar__title" id="wsTitle">Command Center</h1>
      <div class="topbar__acts">
        <!-- Platform status, in one word, on every workspace. The banner below
             carries the detail; this is the always-on indicator. -->
        <span class="topbar__status" id="status"></span>
        <button class="btn btn--small" data-act="toggle-notes" id="notesToggle"
          aria-expanded="false" aria-controls="noteCenter">Updates</button>
        <button class="btn btn--small btn--primary" data-act="open-new">New company</button>
      </div>
    </header>

    <!-- System strip: platform-level, not workspace-level, so it lives in the
         frame and shows on every workspace (docs/design/05-layout.md). -->
    <div id="healthbar" aria-live="polite"></div>
    <div id="flash" aria-live="polite"></div>
    <div class="note-center" id="noteCenter" hidden></div>

    <!-- Regions are declared here and filled by the modules, so the document
         has a stable shape before any data arrives and nothing shifts when it
         does. Every workspace's regions exist from the first paint; only the
         active one is filled. -->
    <main class="ws" id="ws" tabindex="-1">

      <section class="ws__pane" data-ws="command-center">
        <div class="tile-row" data-region="tiles"></div>
        <section data-region="asks"></section>
        <h2 class="section-head">Your companies</h2>
        <div class="grid" data-region="companies"></div>
      </section>

      <section class="ws__pane" data-ws="companies" hidden>
        <div class="grid" data-region="companies"></div>
      </section>

      <section class="ws__pane" data-ws="approvals" hidden>
        <div data-region="asks"></div>
      </section>

      <section class="ws__pane" data-ws="settings" hidden>
        <div data-region="settings"></div>
      </section>

    </main>
  </div>
</div>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet" id="sheet"></div>
</div>

<script type="module" src="/static/app/main.js"></script>
</body>
</html>
