[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — AI Enterprise Operating System (Architecture Spec v1.4)"
requires-python = ">=3.14"
dependencies = [
    "temporalio>=1.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
]

[project.scripts]
jarvis = "jarvis.shell.launcher:main"
jarvis-run = "jarvis.shell.service:serve_headless"

[project.optional-dependencies]
desktop = [
    "pywebview>=5.3",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "ASYNC", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.pyright]
include = ["jarvis", "tests"]
strict = ["jarvis"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: needs the live Postgres; skips (visibly) when it is unreachable",
]
